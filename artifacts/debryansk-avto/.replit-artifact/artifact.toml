kind = "web"
previewPath = "/"
title = "Дебрянск Авто"
version = "1.0.0"
id = "artifacts/debryansk-avto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19052

[services.development]
run = "pnpm --filter @workspace/debryansk-avto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/debryansk-avto", "run", "build" ]
publicDir = "artifacts/debryansk-avto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19052"
BASE_PATH = "/"
