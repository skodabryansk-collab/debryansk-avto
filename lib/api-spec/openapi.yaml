openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /cars/image-thumbnail:
    get:
      operationId: getCarImageThumbnail
      summary: Serve a resized WebP thumbnail for a stock car image
      parameters:
        - name: src
          in: query
          required: true
          description: Auto.ru stock image URL from avatars.avto.ru
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Resized WebP image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unsupported image URL
        "502":
          description: Source image could not be processed
        "503":
          description: Thumbnail service is temporarily busy
  /showroom-survey/models:
    get:
      operationId: getShowroomSurveyModels
      summary: List models available in the public new-car catalogue for showroom surveys
      responses:
        "200":
          description: Deduplicated new-car model directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowroomSurveyModelsResponse"
        "503":
          description: New-car model catalogue is temporarily unavailable
  /showroom-survey/submissions:
    post:
      operationId: submitShowroomSurvey
      summary: Submit a showroom survey and create a qualified vehicle-interest lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowroomSurveySubmissionInput"
      responses:
        "200":
          description: Survey was already submitted; existing lead returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowroomSurveySubmissionResponse"
        "201":
          description: Survey and lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowroomSurveySubmissionResponse"
        "400":
          description: Invalid survey data or missing consent
        "409":
          description: Submission key is already associated with a different payload
        "503":
          description: Survey could not be saved temporarily
  /surveys/{slug}:
    get:
      operationId: getPublicSurvey
      summary: Get a published customer survey by its public slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Published survey configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyPublicResponse"
        "404":
          description: Survey not found or not published
  /surveys/{slug}/responses:
    post:
      operationId: submitCustomerSurveyResponse
      summary: Submit answers to a published customer survey
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSurveyResponseInput"
      responses:
        "200":
          description: Duplicate response already saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveySubmissionResult"
        "201":
          description: Survey response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveySubmissionResult"
        "400":
          description: Invalid answers or missing required consent
        "404":
          description: Survey not found or not published
        "409":
          description: Submission key was already used for different answers
        "503":
          description: Survey response could not be saved
  /admin/surveys:
    get:
      operationId: listCustomerSurveys
      summary: List surveys and response counts
      responses:
        "200":
          description: Surveys available to administrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyListResponse"
        "401":
          description: Administrator authentication required
    post:
      operationId: createCustomerSurvey
      summary: Create a customer survey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSurveyInput"
      responses:
        "201":
          description: Survey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyRecordResponse"
        "400":
          description: Invalid survey definition
        "409":
          description: Survey slug already exists
        "401":
          description: Administrator authentication required
  /admin/surveys/{id}:
    get:
      operationId: getCustomerSurvey
      summary: Get a survey configuration for editing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Survey editor data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyRecordResponse"
        "404":
          description: Survey not found
        "401":
          description: Administrator authentication required
    put:
      operationId: updateCustomerSurvey
      summary: Update a survey and publish or archive it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerSurveyInput"
      responses:
        "200":
          description: Survey updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyRecordResponse"
        "400":
          description: Invalid survey definition
        "404":
          description: Survey not found
        "409":
          description: Survey slug already exists
        "401":
          description: Administrator authentication required
  /admin/survey-stats:
    get:
      operationId: getCustomerSurveyStats
      summary: Get aggregated survey responses
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Aggregated response counts and answer distributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyStatsResponse"
        "404":
          description: Survey not found
        "401":
          description: Administrator authentication required
  /admin/survey-responses:
    get:
      operationId: listCustomerSurveyResponses
      summary: List survey responses and their original question snapshots
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Survey response page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSurveyResponsesResponse"
        "404":
          description: Survey not found
        "401":
          description: Administrator authentication required
  /admin/ai-images/models:
    get:
      operationId: listAiImageModels
      summary: Available image models and verified generation capabilities
      responses:
        "200":
          description: Image model catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiImageModelCatalogue"
        "401":
          description: Administrator authentication required
  /manager/client-cards:
    get:
      operationId: listManagerClientCards
      summary: List manager client worksheets with filters and pagination
      parameters:
        - name: client
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: phone
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
        - name: managerId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Filtered page of client worksheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardsPageResponse"
        "400":
          description: Invalid filter
        "401":
          description: Manager authentication required
    post:
      operationId: createManagerClientCard
      summary: Create a manager client worksheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerClientCardInput"
      responses:
        "201":
          description: Worksheet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardCreatedResponse"
        "400":
          description: Invalid worksheet data
        "401":
          description: Manager authentication required
  /integrations/1c/v1/client-cards:
    get:
      operationId: getOneCClientCards
      summary: Poll new manager client worksheets for 1C
      description: >
        Returns client worksheets with IDs greater than after_id in ascending order.
        The caller must persist next_cursor only after successfully importing every returned item.
        Records are not returned while organization or department codes are provisional.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: after_id
          in: query
          required: true
          description: Last source ID successfully imported by 1C
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Next page of worksheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsResponse"
        "400":
          description: Invalid cursor or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "409":
          description: A worksheet has an unresolved brand/location or unconfirmed 1C code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading the worksheet feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v2/client-cards:
    get:
      operationId: getOneCDivisionWorksheets
      summary: Poll integration worksheets grouped by organization and department
      description: >
        Each item is a separate 1C integration worksheet linked to one manager worksheet.
        Needs and the offered vehicle are grouped by the exact organization_code and department_code pair.
        Different brands with the same pair are combined into one item; a different pair gets its own ID.
        Only active worksheets without a 1C business status are returned. A successful import must be
        acknowledged with worksheet_status "Создан"; afterward the item no longer appears in this feed.
        Poll the new-record feed without a stored checkpoint: omit after_id at the start of every polling cycle.
        When has_more is true, next_cursor is only for requesting the next page in that same cycle. A non-empty
        1C business status removes the active worksheet from this feed. For edits and deletions, use the separate
        changes feed and persist its changes cursor only after successfully processing a page.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: after_id
          in: query
          required: false
          description: Last ID from the current page; omit when starting a new polling cycle
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Page of active worksheets without a 1C business status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetsResponse"
        "400":
          description: Invalid cursor or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading the worksheet feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v2/client-cards/changes:
    get:
      operationId: getOneCDivisionWorksheetChanges
      summary: Poll changes and deletions for division worksheets
      description: >
        Returns one event per changed integration worksheet. `upsert` contains the latest worksheet;
        `delete` removes that source_key in 1C. The manager worksheet remains a single record in the admin panel.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: after_change_id
          in: query
          required: true
          description: Last change ID successfully processed by 1C
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Next page of division worksheet changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetChangesResponse"
        "400":
          description: Invalid cursor or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetChangesErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetChangesErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetChangesErrorResponse"
        "500":
          description: Internal error while reading the change feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionWorksheetChangesErrorResponse"
  /integrations/1c/v2/client-cards/changes/initial-cursor:
    get:
      operationId: getOneCDivisionWorksheetChangesInitialCursor
      summary: Get the starting cursor for division worksheet changes
      description: Call once during initial setup if historical edit events should not be replayed.
      security:
        - oneCClientCardsToken: []
      responses:
        "200":
          description: Current end of the change sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardChangesInitialCursorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading the change cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v2/client-cards/{id}/onec-data:
    patch:
      operationId: updateOneCDivisionWorksheetMetadata
      summary: Send manager and worksheet status for one division record
      description: >
        `id` is the division integration worksheet ID, not the manager worksheet ID.
        Status and archive reason are saved independently for this organization/department pair.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Division integration worksheet ID returned by the v2 feed
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneCClientCardMetadataUpdate"
      responses:
        "200":
          description: 1C data stored for the division worksheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCDivisionMetadataUpdateResponse"
        "400":
          description: Invalid worksheet ID or update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "404":
          description: Division worksheet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Failed to save data received from 1C
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v1/client-cards/{id}/onec-data:
    patch:
      operationId: updateOneCClientCardMetadata
      summary: Send dealership manager, worksheet status, and archive reason from 1C
      description: >
        Stores the latest dealership manager, worksheet status, and archive reason received from 1C.
        worksheet_status must be one of: Создан, В работе, Проверка перед закрытием, Архив, Завершен.
        When worksheet_status is Архив, archive_reason is required and must contain the refusal reason.
        Omitted fields remain unchanged; explicit null or an empty string clears a field.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: Source worksheet ID returned by the client-card feed
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneCClientCardMetadataUpdate"
      responses:
        "200":
          description: 1C data stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardMetadataUpdateResponse"
        "400":
          description: Invalid worksheet ID or update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "404":
          description: Worksheet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Failed to save data received from 1C
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v1/client-cards/initial-cursor:
    get:
      operationId: getOneCClientCardsInitialCursor
      summary: Get the starting cursor without exporting historical client data
      description: Call once during initial setup, store after_id in 1C, then poll the feed endpoint.
      security:
        - oneCClientCardsToken: []
      responses:
        "200":
          description: Initial cursor at the current end of the client worksheet table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsInitialCursorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading the cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v1/client-cards/changes:
    get:
      operationId: getOneCClientCardChanges
      summary: Poll edits to manager client worksheets for 1C
      description: >
        Returns edits with IDs greater than after_change_id in ascending order.
        The caller must persist next_cursor only after applying every event.
        Each event contains the latest full worksheet, stable brand source keys,
        and source keys for brand records that must be removed.
      security:
        - oneCClientCardsToken: []
      parameters:
        - name: after_change_id
          in: query
          required: true
          description: Last edit event successfully applied by 1C
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Next page of worksheet edits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardChangesResponse"
        "400":
          description: Invalid cursor or page size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "409":
          description: An edited worksheet has an unresolved brand/location or unconfirmed 1C code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading worksheet edits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /integrations/1c/v1/client-cards/changes/initial-cursor:
    get:
      operationId: getOneCClientCardChangesInitialCursor
      summary: Get the starting edit cursor without exporting historical edits
      description: Call once during 1C change-feed setup, then poll the changes endpoint.
      security:
        - oneCClientCardsToken: []
      responses:
        "200":
          description: Initial cursor at the current end of the worksheet edit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardChangesInitialCursorResponse"
        "401":
          description: Missing or invalid dedicated 1C token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "503":
          description: The 1C token is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
        "500":
          description: Internal error while reading the edit cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCClientCardsErrorResponse"
  /admin/onec/status:
    get:
      operationId: getOneCAdminStatus
      summary: Get safe 1C integration configuration status
      security:
        - adminSessionToken: []
      responses:
        "200":
          description: Token configuration and recent polling summary without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCAdminStatus"
        "401":
          description: Administrator authentication required
  /admin/onec/logs:
    get:
      operationId: getOneCAdminLogs
      summary: List 1C exchange and settings events
      security:
        - adminSessionToken: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 10, maximum: 100, default: 25 }
        - name: event_type
          in: query
          required: false
          schema: { type: string, enum: [api_request, settings_change] }
        - name: outcome
          in: query
          required: false
          schema: { type: string, enum: [success, error, settings_updated] }
      responses:
        "200":
          description: Page of safe exchange metadata and settings audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCAdminLogsPage"
        "401":
          description: Administrator authentication required
  /admin/onec/mappings:
    get:
      operationId: getOneCAdminMappings
      summary: List organization and department code mappings
      security:
        - adminSessionToken: []
      responses:
        "200":
          description: Current 1C codes mapped to locations and brands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCAdminMappings"
        "401":
          description: Administrator authentication required
  /admin/onec/mappings/organizations/{locationId}:
    patch:
      operationId: updateOneCOrganizationMapping
      summary: Update the 1C organization code for a location
      security:
        - adminSessionToken: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneCMappingUpdateInput"
      responses:
        "200":
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCMappingUpdateResponse"
        "400":
          description: Invalid code or confirmation state
        "401":
          description: Administrator authentication required
        "404":
          description: Location not found
  /admin/onec/mappings/departments/{brandId}:
    patch:
      operationId: updateOneCDepartmentMapping
      summary: Update the 1C department code for a brand
      security:
        - adminSessionToken: []
      parameters:
        - name: brandId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneCMappingUpdateInput"
      responses:
        "200":
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneCMappingUpdateResponse"
        "400":
          description: Invalid code or confirmation state
        "401":
          description: Administrator authentication required
        "404":
          description: Brand not found
  /manager/client-cards/managers:
    get:
      operationId: listManagerClientCardManagers
      summary: List managers available in the worksheet filter
      responses:
        "200":
          description: Managers visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardManagersResponse"
        "401":
          description: Manager authentication required
  /manager/client-cards/needs/brands:
    get:
      operationId: listManagerClientNeedsBrands
      summary: List active CM Expert new-car brands available to the manager
      responses:
        "200":
          description: Available brands from active CM Expert stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardStringListResponse"
        "401":
          description: Manager authentication required
  /manager/client-cards/needs/models:
    get:
      operationId: listManagerClientNeedsModels
      summary: List active CM Expert models for a selected brand
      parameters:
        - name: brand
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 180 }
      responses:
        "200":
          description: Available models from active CM Expert stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardStringListResponse"
        "400":
          description: Brand is missing
        "401":
          description: Manager authentication required
  /manager/client-cards/inventory:
    get:
      operationId: searchManagerClientCardInventory
      summary: Search manager-visible stock by vehicle model or partial VIN
      parameters:
        - name: brand
          in: query
          required: false
          schema: { type: string, maxLength: 180 }
        - name: model
          in: query
          required: false
          schema: { type: string, maxLength: 180 }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 180 }
        - name: vin
          in: query
          required: false
          schema: { type: string, minLength: 4, maxLength: 32 }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [new, used] }
      responses:
        "200":
          description: Matching vehicles visible to the current manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardInventoryResponse"
        "400":
          description: Invalid or incomplete search
        "401":
          description: Manager authentication required
  /manager/client-cards/export.csv:
    get:
      operationId: exportManagerClientCards
      summary: Export filtered manager client worksheets as CSV
      parameters:
        - name: client
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: phone
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
        - name: managerId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: UTF-8 CSV file
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Invalid filter
        "401":
          description: Manager authentication required
  /manager/client-cards/{id}:
    get:
      operationId: getManagerClientCard
      summary: Get a manager client worksheet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Worksheet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardResponse"
        "401":
          description: Manager authentication required
        "404":
          description: Worksheet not found
    put:
      operationId: updateManagerClientCard
      summary: Update a manager client worksheet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerClientCardInput"
      responses:
        "200":
          description: Worksheet updated and an audit/change event created if values changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerClientCardUpdatedResponse"
        "400":
          description: Invalid worksheet data
        "401":
          description: Manager authentication required
        "403":
          description: Worksheet belongs to another manager or a selected vehicle is not allowed
        "404":
          description: Worksheet not found
  /car-catalog/brands:
    get:
      operationId: listAutoRuCarBrands
      summary: List car brands from the server-side Auto.ru catalog proxy
      responses:
        "200":
          description: Auto.ru car brands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoRuCatalogBrandsResponse"
        "500":
          description: Auto.ru catalog is temporarily unavailable
  /car-catalog/models:
    get:
      operationId: listAutoRuCarModels
      summary: List Auto.ru models for a selected brand
      parameters:
        - name: brandId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Auto.ru car models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoRuCatalogModelsResponse"
        "400":
          description: Brand identifier is missing
        "500":
          description: Auto.ru catalog is temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    oneCClientCardsToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Dedicated read-only token for the 1C client worksheet feed
    adminSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Administrator session token
  schemas:
    AiImageModelCatalogue:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiImageModel"
    AiImageModel:
      type: object
      required: [value, label, textToImage, imageToImage, supportsQuality, referenceLimit, available, reason]
      properties:
        value:
          type: string
        label:
          type: string
        textToImage:
          type: boolean
        imageToImage:
          type: boolean
        supportsQuality:
          type: boolean
        referenceLimit:
          type: integer
        available:
          type: boolean
        reason:
          type: string
    ShowroomSurveyModelsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ShowroomSurveyModel"
    ShowroomSurveyModel:
      type: object
      required: [id, brand, model]
      properties:
        id:
          type: string
        brand:
          type: string
        model:
          type: string
    ShowroomSurveyRatings:
      type: object
      required: [design, interior, driverComfort, rearSeat, trunk]
      properties:
        design:
          type: integer
          minimum: 1
          maximum: 5
        interior:
          type: integer
          minimum: 1
          maximum: 5
        driverComfort:
          type: integer
          minimum: 1
          maximum: 5
        rearSeat:
          type: integer
          minimum: 1
          maximum: 5
        trunk:
          type: integer
          minimum: 1
          maximum: 5
    ShowroomSurveyEvaluationInput:
      type: object
      required: [modelId, ratings]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 180
        ratings:
          $ref: "#/components/schemas/ShowroomSurveyRatings"
    ShowroomSurveySubmissionInput:
      type: object
      required: [submissionId, name, phone, consent, evaluations]
      properties:
        submissionId:
          type: string
          minLength: 16
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 10
          maxLength: 32
        consent:
          type: boolean
          enum: [true]
        communicationsConsent:
          type: boolean
          description: Optional permission to contact the visitor about the vehicles they selected
        source:
          type: ["string", "null"]
          maxLength: 120
        evaluations:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ShowroomSurveyEvaluationInput"
    ShowroomSurveySubmissionResponse:
      type: object
      required: [ok, submissionId, leadId, duplicate]
      properties:
        ok:
          type: boolean
        submissionId:
          type: string
        leadId:
          type: integer
        duplicate:
          type: boolean
    CustomerSurveyQuestionType:
      type: string
      enum: [rating, single_choice, multiple_choice, text, brand_picker, model_picker]
    CustomerSurveyQuestion:
      type: object
      required: [id, type, label, required]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 48
        type:
          $ref: "#/components/schemas/CustomerSurveyQuestionType"
        label:
          type: string
          minLength: 2
          maxLength: 180
        description:
          type: ["string", "null"]
          maxLength: 300
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
            maxLength: 100
        min:
          type: integer
          minimum: 0
          maximum: 10
        max:
          type: integer
          minimum: 1
          maximum: 10
        minLabel:
          type: string
          maxLength: 50
        maxLabel:
          type: string
          maxLength: 50
        dependsOn:
          type: string
          maxLength: 48
    CustomerSurveyDefinition:
      type: object
      required: [mode, questions, collectContact, processingConsent, communicationsConsent]
      properties:
        mode:
          type: string
          enum: [standard, showroom]
        questions:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/CustomerSurveyQuestion"
        collectContact:
          type: boolean
        processingConsent:
          type: boolean
        communicationsConsent:
          type: boolean
    CustomerSurveyInput:
      type: object
      required: [title, slug, status, definition]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        status:
          type: string
          enum: [draft, published, archived]
        definition:
          $ref: "#/components/schemas/CustomerSurveyDefinition"
    CustomerSurveyRecord:
      type: object
      required: [id, title, slug, status, definition, version, responseCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        definition:
          $ref: "#/components/schemas/CustomerSurveyDefinition"
        version:
          type: integer
        responseCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomerSurveyListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSurveyRecord"
    CustomerSurveyRecordResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/CustomerSurveyRecord"
    CustomerSurveyPublicResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          type: object
          required: [title, slug, version, definition]
          properties:
            title:
              type: string
            slug:
              type: string
            version:
              type: integer
            definition:
              $ref: "#/components/schemas/CustomerSurveyDefinition"
    CustomerSurveyResponseInput:
      type: object
      required: [submissionId, answers]
      properties:
        submissionId:
          type: string
          minLength: 16
          maxLength: 80
        answers:
          type: object
          additionalProperties: true
        name:
          type: ["string", "null"]
          maxLength: 120
        phone:
          type: ["string", "null"]
          maxLength: 32
        consent:
          type: boolean
        communicationsConsent:
          type: boolean
        source:
          type: ["string", "null"]
          maxLength: 120
    CustomerSurveySubmissionResult:
      type: object
      required: [ok, duplicate, responseId, leadId]
      properties:
        ok:
          type: boolean
        duplicate:
          type: boolean
        responseId:
          type: integer
        leadId:
          type: ["integer", "null"]
    CustomerSurveyBucket:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
    CustomerSurveyQuestionStats:
      type: object
      required: [questionId, label, type, answered, average, buckets]
      properties:
        questionId:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/CustomerSurveyQuestionType"
        answered:
          type: integer
        average:
          type: ["number", "null"]
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSurveyBucket"
    CustomerSurveyDayCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
    CustomerSurveyStats:
      type: object
      required: [totalResponses, byDate, questions]
      properties:
        totalResponses:
          type: integer
        byDate:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSurveyDayCount"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSurveyQuestionStats"
    CustomerSurveyStatsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
        data:
          $ref: "#/components/schemas/CustomerSurveyStats"
    CustomerSurveyResponseItem:
      type: object
      required: [id, submittedAt, surveyVersion, answers, definitionSnapshot, name, phone, source, processingConsent, communicationsConsent]
      properties:
        id:
          type: integer
        submittedAt:
          type: string
          format: date-time
        surveyVersion:
          type: integer
        answers:
          type: object
          additionalProperties: true
        definitionSnapshot:
          $ref: "#/components/schemas/CustomerSurveyDefinition"
        name:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        processingConsent:
          type: ["boolean", "null"]
        communicationsConsent:
          type: ["boolean", "null"]
    CustomerSurveyResponsesResponse:
      type: object
      required: [ok, data, total, page, pages]
      properties:
        ok:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSurveyResponseItem"
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
    AutoRuCatalogBrand:
      type: object
      required: [id, name, cyrillicName, isPopular]
      properties:
        id: { type: string }
        name: { type: string }
        cyrillicName: { type: string }
        isPopular: { type: boolean }
    AutoRuCatalogModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    AutoRuCatalogBrandsResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AutoRuCatalogBrand" }
    AutoRuCatalogModelsResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AutoRuCatalogModel" }
    ManagerClientCarSnapshot:
      type: object
      required: [id, externalId, type, brand, model, year, modification, complectation, color, price, imageUrl, vin]
      properties:
        id: { type: integer }
        externalId: { type: string }
        type: { type: string }
        brand: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        modification: { type: ["string", "null"] }
        complectation: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        price: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        vin: { type: ["string", "null"] }
    ManagerClientNeed:
      type: object
      required: [brand, model, undecided, budgetRange]
      properties:
        brand: { type: ["string", "null"], maxLength: 180 }
        model: { type: ["string", "null"], maxLength: 180 }
        undecided: { type: boolean }
        budgetRange: { type: ["string", "null"], enum: ["Не указан", "до 2 млн", "2–3 млн", "3–5 млн", "5+ млн", null] }
        plannedPurchaseDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    ManagerClientCurrentCar:
      type: object
      required: [brand, model, year, mileage, generation, bodyType, ownersCount, snapshot, tradeInPlan]
      properties:
        brand: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        year: { type: integer, minimum: 1950, maximum: 2100 }
        mileage: { type: integer, minimum: 0, maximum: 2000000 }
        generation: { type: ["string", "null"], maxLength: 120 }
        bodyType: { type: ["string", "null"], maxLength: 120 }
        ownersCount: { type: ["string", "null"], enum: ["1", "2", "3", "4+", null] }
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/ManagerClientCarSnapshot"
            - type: "null"
        tradeInPlan: { type: ["string", "null"], enum: ["Да", "Нет", "Пока не решил", null] }
    ManagerClientCardOneCWorksheet:
      type: object
      required: [id, sourceKey, organizationCode, departmentCode, brandNames, dealerManager, worksheetStatus, archiveReason, onecUpdatedAt]
      properties:
        id: { type: integer }
        sourceKey: { type: string }
        organizationCode: { type: string }
        departmentCode: { type: string }
        brandNames:
          type: array
          items: { type: string }
        dealerManager: { type: ["string", "null"] }
        worksheetStatus: { type: ["string", "null"] }
        archiveReason: { type: ["string", "null"] }
        onecUpdatedAt: { type: ["string", "null"], format: date-time }
    ManagerClientCard:
      type: object
      required: [id, managerId, managerName, clientName, clientPhone, clientGender, desiredBrand, desiredModel, desiredVehicleUndecided, budgetRange, currentCar, currentCarBrand, currentCarModel, currentCarYear, currentCarMileage, currentCarGeneration, currentCarBodyType, currentCarOwnersCount, currentCarSnapshot, tradeInPlan, needs, currentCars, commercialBrand, commercialModel, commercialCarId, commercialCarSnapshot, paymentMethod, comment, onecDealerManager, onecWorksheetStatus, onecArchiveReason, onecUpdatedAt, onecWorksheets, createdAt, updatedAt]
      properties:
        id: { type: integer }
        managerId: { type: integer }
        managerName: { type: ["string", "null"] }
        clientName: { type: string }
        clientPhone: { type: string }
        clientGender: { type: ["string", "null"], enum: [male, female, null] }
        desiredBrand: { type: ["string", "null"] }
        desiredModel: { type: ["string", "null"] }
        desiredVehicleUndecided: { type: boolean }
        budgetRange: { type: ["string", "null"] }
        currentCar: { type: ["string", "null"] }
        currentCarBrand: { type: ["string", "null"] }
        currentCarModel: { type: ["string", "null"] }
        currentCarYear: { type: ["integer", "null"] }
        currentCarMileage: { type: ["integer", "null"] }
        currentCarGeneration: { type: ["string", "null"] }
        currentCarBodyType: { type: ["string", "null"] }
        currentCarOwnersCount: { type: ["string", "null"] }
        currentCarSnapshot:
          oneOf:
            - $ref: "#/components/schemas/ManagerClientCarSnapshot"
            - type: "null"
        tradeInPlan: { type: ["string", "null"] }
        needs:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientNeed" }
        currentCars:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientCurrentCar" }
        commercialBrand: { type: ["string", "null"] }
        commercialModel: { type: ["string", "null"] }
        commercialCarId: { type: ["integer", "null"] }
        commercialCarSnapshot:
          oneOf:
            - $ref: "#/components/schemas/ManagerClientCarSnapshot"
            - type: "null"
        paymentMethod: { type: ["string", "null"] }
        comment: { type: ["string", "null"] }
        onecDealerManager: { type: ["string", "null"] }
        onecWorksheetStatus: { type: ["string", "null"] }
        onecArchiveReason: { type: ["string", "null"] }
        onecUpdatedAt: { type: ["string", "null"], format: date-time }
        onecWorksheets:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientCardOneCWorksheet" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        editHistory:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientCardEditHistoryEntry" }
    ManagerClientCardFieldChange:
      type: object
      required: [field, oldValue, newValue]
      properties:
        field: { type: string }
        oldValue: {}
        newValue: {}
    ManagerClientCardEditHistoryEntry:
      type: object
      required: [id, editorName, editorRole, createdAt, changes]
      properties:
        id: { type: integer }
        editorName: { type: string }
        editorRole: { type: string, enum: [manager, admin] }
        createdAt: { type: string, format: date-time }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientCardFieldChange" }
    ManagerClientCardInput:
      type: object
      required: [clientName, clientPhone, clientGender, desiredBrand, desiredModel, desiredVehicleUndecided, budgetRange, currentCar, currentCarBrand, currentCarModel, currentCarYear, currentCarMileage, currentCarGeneration, currentCarBodyType, currentCarOwnersCount, tradeInPlan, commercialBrand, commercialModel, commercialCarId, paymentMethod, comment]
      properties:
        clientName: { type: string, minLength: 2, maxLength: 120 }
        clientPhone: { type: string, minLength: 10, maxLength: 40 }
        clientGender: { type: ["string", "null"], enum: [male, female, null] }
        desiredBrand: { type: ["string", "null"], maxLength: 180 }
        desiredModel: { type: ["string", "null"], maxLength: 180 }
        desiredVehicleUndecided: { type: boolean }
        budgetRange: { type: ["string", "null"], enum: ["Не указан", "до 2 млн", "2–3 млн", "3–5 млн", "5+ млн", null] }
        currentCar: { type: ["string", "null"], maxLength: 180 }
        currentCarBrand: { type: ["string", "null"], maxLength: 120 }
        currentCarModel: { type: ["string", "null"], maxLength: 120 }
        currentCarYear: { type: ["integer", "null"], minimum: 1950, maximum: 2100 }
        currentCarMileage: { type: ["integer", "null"], minimum: 0, maximum: 2000000 }
        currentCarGeneration: { type: ["string", "null"], maxLength: 120 }
        currentCarBodyType: { type: ["string", "null"], maxLength: 120 }
        currentCarOwnersCount: { type: ["string", "null"], enum: ["1", "2", "3", "4+", null] }
        tradeInPlan: { type: ["string", "null"], enum: ["Да", "Нет", "Пока не решил", null] }
        needs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ManagerClientNeed" }
        currentCars:
          type: array
          items: { $ref: "#/components/schemas/ManagerClientCurrentCar" }
