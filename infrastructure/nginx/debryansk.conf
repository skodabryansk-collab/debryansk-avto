limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name debryansk-auto.ru www.debryansk-auto.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    limit_req zone=general burst=50 nodelay;
    limit_conn perip 30;
    server_name debryansk-auto.ru www.debryansk-auto.ru;

    ssl_certificate /etc/letsencrypt/live/debryansk-auto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debryansk-auto.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_buffer_size 1400;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;
    keepalive_timeout 65;

    # Vite assets — immutable cache, served directly
    location /assets/ {
        root /opt/debryansk/frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Uploaded files (logos, photos, PDFs) — served directly by nginx.
    # default_type image/webp: extensionless UUID files are WebP images uploaded
    # without a file extension (legacy GCS migration). Without this directive,
    # nginx falls back to application/octet-stream, breaking browser image caching
    # and LCP scoring.
    location /uploads/ {
        alias /opt/debryansk/uploads/;
        default_type image/webp;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Admin panel assets — immutable (hashed filenames, safe to cache 1 year)
    location ^~ /admin/assets/ {
        alias /opt/debryansk/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin panel — no-cache for HTML (SPA entry point, changes on every deploy)
    location /admin {
        alias /opt/debryansk/admin/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ @admin_fallback;
    }

    location @admin_fallback {
        root /opt/debryansk;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /admin/index.html =404;
    }

    # Block scanners and sensitive paths
    location ~* /(.env|.git|phpinfo|php.php|.env..*|wp-admin|wp-login|xmlrpc) {
        return 444;
    }

    # Root page — proxy to API for prerendered HTML
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    # All routes → proxy to Express
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    # Named location for API proxy
    location @proxy {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    # Static fallback when API is down — serves SPA shell
    location @static_fallback {
        root /opt/debryansk/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
